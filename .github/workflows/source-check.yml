name: Source checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  source:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Check repository source and documentation
        run: python -B -X utf8 .github/scripts/check_repository.py
      - name: Run mocked activation tests
        run: python -B -X utf8 -m unittest discover -s modkit -p test_client_activation.py -v
      - name: Check local diagnostic report allowlist
        run: python -B -X utf8 -m unittest discover -s modkit -p test_support_diagnostics.py -v

  mdata-synthetic:
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.13'
      - name: Install pinned test dependencies
        run: python -m pip install --disable-pip-version-check -r modkit/requirements.txt
      - name: Run synthetic MData tests in an isolated profile
        shell: pwsh
        run: |
          $testRoot = Join-Path '${{ runner.temp }}' 'valmax-mdata'
          $env:VALMAX_TEST_TEMP_ROOT = Join-Path $testRoot 'test-temp'
          $env:TEMP = Join-Path $testRoot 'tmp'
          $env:TMP = $env:TEMP
          $env:USERPROFILE = Join-Path $testRoot 'user'
          $env:APPDATA = Join-Path $env:USERPROFILE 'AppData\Roaming'
          $env:LOCALAPPDATA = Join-Path $env:USERPROFILE 'AppData\Local'
          New-Item -ItemType Directory -Force -Path $env:VALMAX_TEST_TEMP_ROOT, $env:TEMP, $env:APPDATA, $env:LOCALAPPDATA | Out-Null
          python -B -X utf8 -m unittest discover -s modkit -p 'test_mdata*.py' -v

  retention-synthetic:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up pinned Rust toolchain
        shell: pwsh
        run: rustup toolchain install 1.99.1 --profile minimal --target x86_64-pc-windows-msvc
      - name: Test account-scoped retention and restart with synthetic data
        shell: pwsh
        working-directory: native
        run: |
          $env:VALMAX_TEST_TEMP_ROOT = Join-Path '${{ runner.temp }}' 'valmax-retention-fixtures'
          $env:CARGO_TARGET_DIR = Join-Path '${{ runner.temp }}' 'valmax-retention-target'
          $env:CARGO_INCREMENTAL = '0'
          New-Item -ItemType Directory -Force -Path $env:VALMAX_TEST_TEMP_ROOT | Out-Null
          cargo test --locked -p valmax-core --lib retention_store::tests -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p valmax-core --test retention_runtime_selected -- --test-threads=1
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --locked -p valmax-core --test quick_reply_store_contract --test support_diagnostics_native -- --test-threads=1
          exit $LASTEXITCODE
