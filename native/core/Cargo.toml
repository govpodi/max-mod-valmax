[package]
name = "valmax-core"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true

[lib]
crate-type = ["rlib", "cdylib", "staticlib"]

[[bin]]
name = "valmax-core-test-driver"
path = "src/bin/test_driver.rs"
required-features = ["test-driver"]

[[bin]]
name = "valmax-chat-lock-test-driver"
path = "src/bin/chat_lock_test_driver.rs"
required-features = ["test-driver"]

[features]
test-driver = []

[dependencies]
aes-gcm = { version = "0.10.3", features = ["zeroize"] }
base64 = "0.22.1"
getrandom = "0.2.16"
lz4_flex = "=0.14.0"
regex = "1.11.1"
rmpv = "=1.3.1"
rustls = { version = "=0.23.45", default-features = false, features = ["ring", "std", "tls12"] }
scrypt = "0.11.0"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.140"
sha2 = "0.10.9"
pbkdf2 = "0.12.2"
subtle = "2.6.1"
zeroize = { version = "1.8.1", features = ["derive"] }
rusqlite = { version = "=0.40.2", default-features = false, features = ["bundled", "limits", "hooks"] }
